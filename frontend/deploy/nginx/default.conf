# nginx for the single-server deployment (OPS-008 §7).
#
# TLS is terminated by whatever sits in front (the provider's load balancer, or certbot on the
# host with `deploy/nginx/tls.conf` dropped in). This server block listens plain on 8080 inside
# the container; `docker-compose.prod.yml` publishes it.
#
# **The one real deviation from OPS-008 §7, and why.** That section serves the SPA straight off
# disk with `try_files $uri /index.html`. Doing so would silently kill a feature this codebase
# already built and tests: `config/spa.py` answers browser routes with the `<head>` already
# filled in, because the crawlers that build link previews for Telegram and VK fetch a page
# once and never run its JavaScript (see `SPA_INDEX_PATH` in env.py and
# `tests/presentation/test_spa_head.py`). Serving `index.html` from nginx means every shared
# festival link previews as the bare site title.
#
# So the split is by *kind of request* rather than by path: hashed assets and real files come
# off disk here, and document requests go to Django, which injects the head and returns the
# same `index.html`. The extra hop costs a proxy pass on navigation only — assets, which are
# the bulk of the bytes, never touch Python.

upstream backend {
    server backend:8000;
    keepalive 16;
}

# What scheme to tell Django the request arrived on.
#
# Not simply `$scheme`: that is *this* nginx's scheme, and in the default shape TLS terminates in
# front of it, so `$scheme` is always `http` and the header would overwrite what the real
# terminator already said. `production.py` sets SECURE_SSL_REDIRECT, so Django would then answer
# every request with a redirect to HTTPS — which the terminator forwards back as plain HTTP.
# A redirect loop, in production only, with nothing in the logs but 301s.
#
# So: honour an upstream terminator's header when there is one, and fall back to our own scheme
# when nginx *is* the terminator (the OPS-008 §7 shape, with a block dropped into /etc/nginx/tls).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# Optional TLS termination in this container (the shape OPS-008 §7 describes). The directory is
# empty by default and the glob then matches nothing, so the stack runs with TLS in front
# instead; drop a `server { listen 8443 ssl; … }` block in to switch. Included here, at http
# level, because a server block cannot live inside another one.
include /etc/nginx/tls/*.conf;

server {
    listen 8080;
    server_name _;

    # Video attachments are allowed up to 200 MB by the upload policy, music up to the
    # competition's configured limit (default 25 MB, max 512 MB). nginx defaults to 1 MB and
    # would reject those with a 413 before Django ever saw them (OPS-008 §7).
    client_max_body_size 512m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml application/xml;

    # Populated from the frontend image on every container start — see docker-entrypoint.sh.
    root /srv/spa;

    # No implicit index: `/` must reach Django so the head is rendered, and an `index`
    # directive here would quietly serve the file instead.
    index index.html.no-implicit-index;

    # This container's own liveness, answered without touching the upstream — "nginx is up and
    # serving" is a different fact from "the API is up", and conflating them makes a backend
    # restart look like an edge failure. Django's /healthz is proxied below for the probes that
    # do want the whole path.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Served from disk ---------------------------------------------------
    #
    # Vite emits content-hashed filenames under /assets/, so these are immutable: a new deploy
    # produces new names. `index.html` must never be cached, which is why it is not here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Django's own static (admin, DRF, Spectacular UI) is served by whitenoise from the
    # backend image's baked manifest — not from this container, which has no copy of it.
    location /static/ {
        include /etc/nginx/vt-proxy.conf;
    }

    # Only reached while S3_BUCKET is unset; with a bucket configured every reference is an
    # absolute bucket URL and nothing arrives here (OPS-007). The volume is shared with the
    # backend and the workers, which is what makes a worker-generated diploma downloadable.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Proxied to Django --------------------------------------------------
    location /api/ {
        include /etc/nginx/vt-proxy.conf;
    }

    location /admin/ {
        include /etc/nginx/vt-proxy.conf;
    }

    # Generated, not files: Django builds both, and the SPA catch-all deliberately excludes
    # them. Left to `try_files` they would be answered with the SPA instead.
    location = /robots.txt {
        include /etc/nginx/vt-proxy.conf;
    }

    location = /sitemap.xml {
        include /etc/nginx/vt-proxy.conf;
    }

    # Orchestrator probes (ARCH-001 §17.4). Not logged: they are every few seconds forever.
    location = /healthz {
        access_log off;
        include /etc/nginx/vt-proxy.conf;
    }

    location = /readyz {
        access_log off;
        include /etc/nginx/vt-proxy.conf;
    }

    # Everything else: a real file on disk (favicon.svg, logo.svg, the hero images) is served
    # from here; anything else is a browser route and goes to Django for its head.
    location / {
        try_files $uri @django;
    }

    location @django {
        include /etc/nginx/vt-proxy.conf;
    }
}
