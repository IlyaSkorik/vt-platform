      parameters:
      - in: query
        name: confirm
        schema:
          type: string
        description: The object's own name, retyped.
        required: true
      - in: path
        name: object_id
        schema:
          type: string
        required: true
      - in: path
        name: target
        schema:
          type: string
        required: true
      tags:
      - Platform
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformPurgePlanResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Confirmation does not match the object's name.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not a platform administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown target kind, or no such object.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Refused: that is the caller''s own account.'
