openapi: 3.1.0
info:
  title: VT Platform API
  version: 1.0.0
  description: «Взлёт талантов» — REST API for children's creative competitions.
paths:
  /api/v1/applications:
    get:
      operationId: applications_list
      description: GET/POST /api/v1/applications - list the applicant's orders or
        create one.
      summary: List my applications
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: Filter to a status, e.g. DRAFT.
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
          description: ''
    post:
      operationId: applications_create
      description: GET/POST /api/v1/applications - list the applicant's orders or
        create one.
      summary: Create an application
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Malformed request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Competition/applicant not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Competition not accepting applications.
  /api/v1/applications/{application_id}:
    get:
      operationId: applications_retrieve
      description: GET /api/v1/applications/{id} - retrieve one order in full.
      summary: Retrieve an application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Not found.
  /api/v1/applications/{application_id}/cancellation:
    post:
      operationId: applications_cancel
      description: POST /api/v1/applications/{id}/cancellation - cancel the order.
      summary: Cancel the application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/consents:
    put:
      operationId: applications_record_consents
      description: PUT /api/v1/applications/{id}/consents - record the accepted consents.
      summary: Record consents
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordConsentsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordConsentsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/educational-organization:
    put:
      operationId: applications_select_organization
      description: PUT /api/v1/applications/{id}/educational-organization - select
        the educational organization.
      summary: Select educational organization
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectEducationalOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectEducationalOrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectEducationalOrganizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/payer:
    put:
      operationId: applications_set_payer
      description: PUT /api/v1/applications/{id}/payer - name who the contract is
        signed with.
      summary: Set the application payer
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPayerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPayerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPayerRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/payment:
    post:
      operationId: applications_mark_paid
      description: POST /api/v1/applications/{id}/payment - record payment.
      summary: Mark paid
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/payment-request:
    post:
      operationId: applications_request_payment
      description: POST /api/v1/applications/{id}/payment-request - move to awaiting
        payment.
      summary: Request payment
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/placement:
    post:
      operationId: applications_submit
      description: POST /api/v1/applications/{id}/placement - submit the order.
      summary: Submit the application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/receipts:
    post:
      operationId: applications_upload_receipt
      description: |-
        POST /api/v1/applications/{id}/receipts - attach one more payment receipt.

        A collection, not a single document: an order's fee is regularly settled by
        several transfers, so posting again adds a receipt instead of replacing the
        one already there.
      summary: Attach a payment receipt
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadReceiptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Malformed request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Application not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Settled, or too many receipts already.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: File too large.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Unsupported file type.
  /api/v1/applications/{application_id}/receipts/{receipt_id}:
    delete:
      operationId: applications_remove_receipt
      description: DELETE /api/v1/applications/{id}/receipts/{receipt_id} - take one
        receipt back.
      summary: Remove a payment receipt
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      - in: path
        name: receipt_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: Application or receipt not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsProblemDetail'
          description: The order is already settled.
  /api/v1/applications/{application_id}/services:
    post:
      operationId: applications_select_service
      description: POST /api/v1/applications/{id}/services - select an additional
        service.
      summary: Select an additional service
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectServiceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/services/{service_id}:
    delete:
      operationId: applications_remove_service
      description: DELETE /api/v1/applications/{id}/services/{serviceId} - remove
        an additional service.
      summary: Remove an additional service
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      - in: path
        name: service_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/submissions:
    post:
      operationId: applications_add_submission
      description: POST /api/v1/applications/{id}/submissions - add a performance
        (submission) to the order.
      summary: Add a submission
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/applications/{application_id}/submissions/{submission_id}:
    delete:
      operationId: applications_remove_submission
      description: DELETE /api/v1/applications/{id}/submissions/{submissionId} - detach
        and cancel a submission.
      summary: Remove a submission
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
        required: true
      - in: path
        name: submission_id
        schema:
          type: string
        required: true
      tags:
      - Applications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
  /api/v1/auth/email-verification/confirmations:
    post:
      operationId: confirmEmailVerification
      description: Confirm the account's email address using the token from the sent
        link.
      summary: Confirm email ownership using the emailed token
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Already verified.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Token expired.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid token.
  /api/v1/auth/email-verification/requests:
    post:
      operationId: requestEmailVerification
      description: Send a fresh verification link to the given address (no-op if unknown/verified).
      summary: (Re)send an email-verification challenge
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: Request accepted (email dispatched if applicable).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
  /api/v1/auth/password-reset/confirmations:
    post:
      operationId: confirmPasswordReset
      description: Set a new password from the emailed token; revokes all sessions.
      summary: Set a new password using the reset token
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '204':
          description: Password reset; all sessions revoked.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Reset token expired.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid token / weak password.
  /api/v1/auth/password-reset/requests:
    post:
      operationId: requestPasswordReset
      description: Send a password-reset link to the given address (no-op if unknown/unverified).
      summary: Begin password recovery (email a reset link)
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: Request accepted (email dispatched if applicable).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
  /api/v1/auth/registration:
    post:
      operationId: auth_registration_create
      description: Create a new adult user account. Public endpoint.
      summary: Register a new account
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Email already in use.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Weak password / invalid.
  /api/v1/auth/sessions:
    post:
      operationId: auth_session_create
      description: Verify credentials and issue an access token (+ rotating refresh
        token).
      summary: Log in (create a session)
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Account suspended or email not verified.
  /api/v1/auth/sessions/current:
    delete:
      operationId: auth_session_current_delete
      description: Blacklist the session's refresh token. The access token is left
        to expire.
      summary: Log out (revoke the current session)
      tags:
      - Identity
      responses:
        '204':
          description: Session revoked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session.
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh
      description: Exchange a valid rotating refresh token for a new access/refresh
        pair.
      summary: Refresh the access token
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid/expired refresh.
  /api/v1/competitions:
    get:
      operationId: listCompetitions
      description: |-
        Organizer Competition API — staff-only, and scoped to the caller's organization.

        Every route that names a competition passes through :meth:`initial`, which
        refuses one belonging to another organization before the action runs. That is
        deliberately one gate rather than a check per action: this viewset carries the
        whole competition configuration surface (nominations, pricing, documents,
        publication), and a rule repeated forty times is a rule with a hole in it.
      tags:
      - Competitions
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Not organization staff.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Competition or element not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Lifecycle or configuration conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Business rule violation.
    post:
      operationId: createCompetition
      description: |-
        Organizer Competition API — staff-only, and scoped to the caller's organization.

        Every route that names a competition passes through :meth:`initial`, which
        refuses one belonging to another organization before the action runs. That is
        deliberately one gate rather than a check per action: this viewset carries the
        whole competition configuration surface (nominations, pricing, documents,
        publication), and a rule repeated forty times is a rule with a hole in it.
      tags:
      - Competitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompetition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCompetition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCompetition'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Not organization staff.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Competition or element not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Lifecycle or configuration conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Business rule violation.
  /api/v1/competitions/{id}:
    get:
      operationId: getCompetition
      description: |-
        Organizer Competition API — staff-only, and scoped to the caller's organization.

        Every route that names a competition passes through :meth:`initial`, which
        refuses one belonging to another organization before the action runs. That is
        deliberately one gate rather than a check per action: this viewset carries the
        whole competition configuration surface (nominations, pricing, documents,
        publication), and a rule repeated forty times is a rule with a hole in it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Competitions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Not organization staff.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Competition or element not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Lifecycle or configuration conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionProblemDetail'
          description: Business rule violation.
    patch:
      operationId: updateCompetition
      description: |-
        Organizer Competition API — staff-only, and scoped to the caller's organization.

