openapi: 3.1.0
info:
  title: VT Platform API
  version: 1.0.0
  description: «Взлёт талантов» — REST API for children's creative competitions.
paths:
  /api/v1/auth/email-verification/confirmations:
    post:
      operationId: confirmEmailVerification
      description: Confirm the account's email address using the token from the sent
        link.
      summary: Confirm email ownership using the emailed token
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Already verified.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Token expired.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid token.
  /api/v1/auth/email-verification/requests:
    post:
      operationId: requestEmailVerification
      description: Send a fresh verification link to the authenticated account's email.
      summary: (Re)send an email-verification challenge
      tags:
      - Identity
      security:
      - jwtAuth: []
      responses:
        '202':
          description: Verification email dispatched.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Already verified.
  /api/v1/auth/registration:
    post:
      operationId: auth_registration_create
      description: Create a new adult user account. Public endpoint.
      summary: Register a new account
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Email already in use.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Weak password / invalid.
  /api/v1/auth/sessions:
    post:
      operationId: auth_session_create
      description: Verify credentials and issue an access token (+ rotating refresh
        token).
      summary: Log in (create a session)
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Account suspended.
  /api/v1/auth/sessions/current:
    delete:
      operationId: auth_session_current_delete
      description: Blacklist the session's refresh token. The access token is left
        to expire.
      summary: Log out (revoke the current session)
      tags:
      - Identity
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Session revoked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session.
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh
      description: Exchange a valid rotating refresh token for a new access/refresh
        pair.
      summary: Refresh the access token
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid/expired refresh.
