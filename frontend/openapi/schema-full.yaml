    CreateAssignmentRequest:
      type: object
      description: |-
        Body for assigning one template to one or more nominations.

        Which slot of each nomination the assignment fills is derived from the
        template's own ``type``, so a mismatch is not expressible. ``categoryIds`` is a
        list because a competition's nominations usually share a design; a single
        nomination is a list of one.
      properties:
        competitionId:
          type: string
          format: uuid
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        templateId:
          type: string
          format: uuid
      required:
      - categoryIds
      - competitionId
      - templateId
    CreateBallotRequest:
      type: object
      description: |-
        Start a ballot.

        ``competitionId`` is optional, and that is the feature rather than a loose end:
        a festival that has not moved onto the platform gets the same ballot as one
        that has.
      properties:
        votesPerVoter:
          type: integer
          maximum: 10
          minimum: 1
        cooldownHours:
          type: integer
          maximum: 336
          minimum: 0
        reveal:
          $ref: '#/components/schemas/RevealEnum'
        title:
          type: string
          maxLength: 200
        competitionId:
          type:
          - string
          - 'null'
          format: uuid
        description:
          type: string
          maxLength: 4000
        opensAt:
          type:
          - string
          - 'null'
          format: date-time
        closesAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - title
    CreateCompetition:
      type: object
      properties:
        organizerId:
          type: string
          format: uuid
