          type: boolean
          default: false
      required:
      - contactType
      - value
    AddDiscipline:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - categoryId
      - name
    AddDocument:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 32
        visibility:
          type: string
          maxLength: 16
        fileReference:
          type: string
          maxLength: 1024
        description:
          type:
          - string
          - 'null'
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        published:
