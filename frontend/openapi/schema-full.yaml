          format: double
          maximum: 4
          minimum: 0.5
          default: 1.2
        letterSpacing:
          type: number
          format: double
          maximum: 100
          minimum: -20
          default: 0.0
        autoShrink:
          type: boolean
          default: true
        wrapText:
          type: boolean
          default: false
