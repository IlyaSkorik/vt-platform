        The whole switchboard, not one switch: whatever is listed is on afterwards and
        everything else is off. That makes a save idempotent and makes "take everything
        away" expressible, which a per-module toggle cannot do in one step.

        An empty list is therefore meaningful and allowed — an organization that holds
        nothing but its own profile and staff.
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModulesEnum'
      required:
      - modules
    SetParticipantMemberCountRequest:
      type: object
      description: |-
        Validate a set-collective-headcount request body.

        How many people this entry stands for. One is the floor the domain allows, but a
        collective of one is not what the field is for — the applicant states the real
        number, and the participant-count band of the chosen group is what judges it.
      properties:
        memberCount:
          type: integer
          minimum: 1
      required:
      - memberCount
    SetParticipantMembersRequest:
      type: object
      description: |-
        Validate a set-collective-members request body.

        The whole roster of ФИО, replacing whatever the participant carried. An empty
        list is valid and means "no individual documents for this entry" — the roster is
        the request for them, so withdrawing it is how the applicant opts back out.
      properties:
        members:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 200
      required:
      - members
    SetPayerRequest:
      type: object
      description: |-
        Validate the payer (contract party) named on the order.

        A natural person only, in three parts. The patronymic is optional because not
        everyone has one; the domain bounds each part, and these limits mirror it so an
        over-long surname is a field error rather than a domain exception.
      properties:
        lastName:
          type: string
          maxLength: 120
        firstName:
          type: string
          maxLength: 120
        middleName:
          type:
          - string
          - 'null'
          maxLength: 120
      required:
      - firstName
      - lastName
    SetPerformanceRequest:
      type: object
      description: |-
        Validate a set-performance request body.

        ``comment`` is the applicant's optional free-text note for the organizers about
        this act (stage entry, props, equipment, backing-track quirks).

        ``ageComposition`` is what ages the performers are, in the applicant's own words
        ("12 детей 8–11 лет и 2 педагога"). A mixed age category requires it before the
        submission may be submitted; a standard one leaves it blank.
      properties:
        title:
          type: string
        durationSeconds:
          type: integer
          minimum: 1
        nominationId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        ageCategoryId:
          type: string
          format: uuid
        participantGroupId:
          type: string
          format: uuid
        participationFormatId:
          type: string
          format: uuid
        comment:
          type: string
          maxLength: 1000
        ageComposition:
          type: string
          maxLength: 300
      required:
      - ageCategoryId
      - disciplineId
      - durationSeconds
      - nominationId
      - participantGroupId
      - participationFormatId
      - title
