components:
  schemas:
    AcceptInvitationRequest:
      type: object
      description: Validate an invitation-acceptance request.
      properties:
        token:
          type: string
      required:
      - token
    AddAdditionalService:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          default: BYN
          maxLength: 3
        description:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
          default: true
      required:
      - amount
      - name
    AddAdmissionRule:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        ageCategoryId:
          type: string
          format: uuid
        participantGroupId:
          type: string
          format: uuid
        participationFormat:
          type: string
          maxLength: 32
      required:
      - ageCategoryId
      - categoryId
      - disciplineId
      - participantGroupId
      - participationFormat
    AddAgeCategory:
      type: object
      properties:
        minAge:
          type: integer
          minimum: 0
        maxAge:
          type: integer
          minimum: 0
      required:
      - maxAge
      - minAge
    AddCategory:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
      required:
      - name
    AddContact:
      type: object
      properties:
        contactType:
          type: string
          maxLength: 32
        value:
          type: string
          maxLength: 500
        isPrimary:
          type: boolean
          default: false
      required:
      - contactType
      - value
    AddDiscipline:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
      required:
      - categoryId
      - name
    AddDocument:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 32
        visibility:
          type: string
          maxLength: 16
        fileReference:
          type: string
          maxLength: 1024
        description:
          type:
          - string
          - 'null'
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        published:
          type: boolean
          default: false
      required:
      - category
      - fileReference
      - title
      - visibility
    AddInformationBlock:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        contentFormat:
          type: string
          default: PLAIN
          maxLength: 16
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        published:
          type: boolean
          default: false
      required:
      - content
      - title
    AddParticipantGroup:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        minCount:
          type: integer
          minimum: 1
        maxCount:
          type:
          - integer
          - 'null'
          minimum: 1
      required:
      - categoryId
      - minCount
      - name
    AddPricingRule:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        ageCategoryId:
          type: string
          format: uuid
        participantGroupId:
          type: string
          format: uuid
        participationFormat:
          type: string
          maxLength: 32
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          default: BYN
          maxLength: 3
      required:
      - ageCategoryId
      - amount
      - categoryId
      - disciplineId
      - participantGroupId
      - participationFormat
    AddRegulation:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        version:
          type: string
          maxLength: 50
        publicationDate:
          type: string
          format: date
        fileReference:
          type: string
          maxLength: 1024
      required:
      - fileReference
      - publicationDate
      - title
      - version
    CompetitionDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        season:
          type: string
        status:
          type: string
        organizerId:
          type: string
        description:
          type:
          - string
          - 'null'
        branding:
          $ref: '#/components/schemas/_Branding'
        venue:
          oneOf:
          - $ref: '#/components/schemas/_Venue'
          - type: 'null'
        registrationPeriod:
          oneOf:
          - $ref: '#/components/schemas/_Period'
          - type: 'null'
        competitionPeriod:
          oneOf:
          - $ref: '#/components/schemas/_Period'
          - type: 'null'
        settings:
          $ref: '#/components/schemas/_Settings'
        deadlines:
          $ref: '#/components/schemas/_Deadlines'
        enabledFormats:
          type: array
          items:
            type: string
        categories:
