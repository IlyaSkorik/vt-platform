      - in: path
        name: teacher_id
        schema:
          type: string
        required: true
      tags:
      - Teacher Directory
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Not found.
    patch:
      operationId: teachers_update
      description: GET/PATCH /api/v1/teachers/{id} - retrieve or update a teacher.
      summary: Update a teacher
      parameters:
      - in: path
        name: teacher_id
        schema:
          type: string
        required: true
      tags:
      - Teacher Directory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTeacherRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTeacherRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTeacherRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Malformed request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Teacher is archived.
  /api/v1/teachers/{teacher_id}/archival:
    post:
      operationId: teachers_archive
      description: POST /api/v1/teachers/{id}/archival - archive a teacher.
      summary: Archive a teacher
      parameters:
      - in: path
        name: teacher_id
        schema:
          type: string
        required: true
      tags:
      - Teacher Directory
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Invalid transition.
  /api/v1/teachers/{teacher_id}/reactivation:
    post:
      operationId: teachers_reactivate
      description: POST /api/v1/teachers/{id}/reactivation - reactivate an archived
        teacher.
      summary: Reactivate a teacher
      parameters:
      - in: path
        name: teacher_id
        schema:
          type: string
        required: true
      tags:
      - Teacher Directory
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachersProblemDetail'
          description: Invalid transition.
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      description: Return the authenticated account (Identity) composed with its staff
        membership (Organization) and whether it operates the platform itself. `staffMembership`
        is null for non-staff users; `platformAdmin` is false for everyone but the
        platform's own operators.
      summary: Get the current user composed with staff membership
      tags:
      - Identity
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
          description: ''
        '401':
          description: No valid session.
  /api/v1/users/me/consents:
    get:
      operationId: listOwnConsents
      description: The consents currently in force. Pass `history=true` for the whole
        journal, including superseded and withdrawn entries — a subject is entitled
        to know not only what they agreed to but when it changed.
      summary: List the signed-in account's consents
      tags:
      - Identity
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountConsentsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session, or the current password is wrong.
    post:
      operationId: recordOwnConsent
      description: Records one consent at the version of the text the client displayed.
        Accepting a consent already held supersedes the earlier entry rather than
        replacing it.
      summary: Record an accepted consent
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountConsentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountConsentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountConsentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountConsentsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session, or the current password is wrong.
  /api/v1/users/me/consents/{consent_type}:
    delete:
      operationId: withdrawOwnConsent
      description: 'Stamps the active entry withdrawn. The entry itself stays: it
        is the evidence that the processing carried out while the consent was in force
        was lawful.'
      summary: Withdraw a consent
      parameters:
      - in: path
        name: consent_type
        schema:
          type: string
        required: true
      tags:
      - Identity
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session, or the current password is wrong.
  /api/v1/users/me/email:
    put:
      operationId: changeOwnEmail
      description: Replace the account's email address. The current password is required,
        because the address is the account's recovery channel. The new address starts
        unverified and a fresh verification link is sent to it; the old one stops
        being the account's.
      summary: Change the signed-in account's email address
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountEmailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session, or the current password is wrong.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: That address already belongs to an account.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The address is not a valid email.
  /api/v1/users/me/password:
    put:
      operationId: changeOwnPassword
      description: 'Replace the account''s password. The current password is required:
        a session left open must not be enough to lock its owner out. The session
        survives the change — an emailed reset (`/auth/password-reset/confirmations`)
        is the flow that revokes every issued credential.'
      summary: Change the signed-in account's password
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session, or the current password is wrong.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The new password is too weak.
  /api/v1/users/me/phone:
    put:
      operationId: changeOwnPhone
      description: 'Set the account''s phone number. No password is asked for: unlike
        the address, the phone is a way for an organizer to reach the applicant, not
        a way back into the account. The number starts unverified.'
      summary: Set or replace the signed-in account's phone number
      tags:
      - Identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPhoneRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountPhoneRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountPhoneRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No valid session, or the current password is wrong.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: That number already belongs to an account.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The number is not a valid phone number.
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      description: Validate an invitation-acceptance request.
      properties:
        token:
          type: string
      required:
      - token
    AccountConsentRequest:
      type: object
      description: |-
        ``POST /users/me/consents`` — record one accepted consent.

        ``version`` is the version of the *text the client displayed*, not a version the
        server picks: the record has to say what the person actually read (LEGAL-001
        §13.3). ``subjectParticipantId`` is set when an adult consents for a child, so a
        later withdrawal resolves to the right participant.
      properties:
        consentType:
          type: string
          maxLength: 32
        version:
          type: string
          maxLength: 64
        purpose:
          type:
          - string
          - 'null'
          maxLength: 255
        subjectParticipantId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - consentType
      - version
    AccountConsentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    AccountEmailRequest:
      type: object
      description: '``PUT /users/me/email`` — move the account to another address.'
      properties:
        email:
          type: string
          format: email
        currentPassword:
          type: string
          writeOnly: true
      required:
      - currentPassword
      - email
    AccountPasswordRequest:
      type: object
      description: '``PUT /users/me/password`` — the account holder replaces their
        own password.'
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          writeOnly: true
      required:
      - currentPassword
      - newPassword
    AccountPhoneRequest:
      type: object
      description: '``PUT /users/me/phone`` — set or replace the account''s phone
        number.'
      properties:
        phone:
          type: string
      required:
      - phone
    AccountResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserResource'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    AddAdditionalService:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          default: BYN
          maxLength: 3
        description:
          type:
          - string
          - 'null'
        billingModel:
          allOf:
          - $ref: '#/components/schemas/BillingModel7acEnum'
          default: PER_PARTICIPANT
        participationFormatIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        required:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
        sortOrder:
          type: integer
          minimum: 0
          default: 0
      required:
      - amount
      - name
      - participationFormatIds
    AddAdmissionRule:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        ageCategoryId:
          type: string
          format: uuid
        participantGroupId:
          type: string
          format: uuid
        participationFormatId:
          type: string
          format: uuid
      required:
      - ageCategoryId
      - categoryId
      - disciplineId
      - participantGroupId
      - participationFormatId
    AddAgeCategory:
      type: object
      properties:
        participantGroupId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        minAge:
          type: integer
          minimum: 0
        maxAge:
          type: integer
          minimum: 0
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
        type:
          allOf:
          - $ref: '#/components/schemas/TypeFd5Enum'
          default: STANDARD
        mixedCalculationMethod:
          oneOf:
          - $ref: '#/components/schemas/MixedCalculationMethodEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - maxAge
      - minAge
      - name
      - participantGroupId
    AddBlockRequest:
      type: object
      description: Validate an add-block body (a break, and later an opening or an
        award).
      properties:
        title:
          type: string
          maxLength: 200
        durationSeconds:
          type: integer
          maximum: 86400
          minimum: 1
        kind:
          allOf:
          - $ref: '#/components/schemas/AddBlockRequestKindEnum'
          default: BREAK
        position:
          type: integer
          minimum: 1
      required:
      - durationSeconds
      - title
    AddBlockRequestKindEnum:
      enum:
      - BREAK
      - OPENING
      - AWARD
      - MASTER_CLASS
      - TECHNICAL
      type: string
      description: |-
        * `BREAK` - BREAK
        * `OPENING` - OPENING
        * `AWARD` - AWARD
        * `MASTER_CLASS` - MASTER_CLASS
        * `TECHNICAL` - TECHNICAL
    AddCategory:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - name
    AddContact:
      type: object
      properties:
        contactType:
          type: string
          maxLength: 32
        value:
          type: string
          maxLength: 500
        isPrimary:
          type: boolean
          default: false
      required:
      - contactType
      - value
    AddDiscipline:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - categoryId
      - name
    AddDocument:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 32
        visibility:
          type: string
          maxLength: 16
        fileReference:
          type: string
          maxLength: 1024
        description:
          type:
          - string
          - 'null'
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        published:
          type: boolean
          default: false
      required:
      - category
      - fileReference
      - title
      - visibility
    AddInformationBlock:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        contentFormat:
          type: string
          default: PLAIN
          maxLength: 16
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        published:
          type: boolean
          default: false
      required:
      - content
      - title
    AddNomineeRequest:
      type: object
      description: Put one more nominee on the ballot.
      properties:
        subtitle:
          type: string
          maxLength: 200
        photo:
          type:
          - string
          - 'null'
          maxLength: 1024
        number:
          type:
          - integer
          - 'null'
          maximum: 100000
          minimum: 0
        title:
          type: string
          maxLength: 200
      required:
      - title
    AddParticipantGroup:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        minCount:
          type: integer
          minimum: 1
        maxCount:
          type:
          - integer
          - 'null'
          minimum: 1
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - minCount
      - name
    AddParticipantRequest:
      type: object
      description: |-
        Validate an add-participant request body.

        A participant is normally chosen from the Participant Registry: send
        ``participantRegistryId`` plus a snapshot. A solo carries the structured name +
        birth date + gender; a collective carries only ``displayName``. All person
        fields are optional so both shapes (and legacy manual entry) validate.
      properties:
        participantRegistryId:
          type:
          - string
          - 'null'
          format: uuid
        displayName:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        birthDate:
          type:
          - string
          - 'null'
          format: date
        gender:
          oneOf:
          - $ref: '#/components/schemas/AddParticipantRequestGenderEnum'
          - $ref: '#/components/schemas/NullEnum'
        memberCount:
          type:
          - integer
          - 'null'
          minimum: 1
    AddParticipantRequestGenderEnum:
      enum:
      - MALE
      - FEMALE
      - OTHER
      type: string
      description: |-
        * `MALE` - MALE
        * `FEMALE` - FEMALE
        * `OTHER` - OTHER
    AddParticipationFormat:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        enabled:
          type: boolean
          default: true
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - name
    AddPricingRule:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        ageCategoryId:
          type: string
          format: uuid
        participantGroupId:
          type: string
          format: uuid
        participationFormatId:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          default: BYN
          maxLength: 3
        calculationType:
          allOf:
          - $ref: '#/components/schemas/CalculationTypeEnum'
          default: PER_PARTICIPANT
      required:
      - ageCategoryId
      - amount
      - categoryId
      - disciplineId
      - participantGroupId
      - participationFormatId
    AddRegulation:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        version:
          type: string
          maxLength: 50
        publicationDate:
          type: string
          format: date
        fileReference:
          type: string
          maxLength: 1024
      required:
      - fileReference
      - publicationDate
      - title
      - version
    AddRowRequest:
      type: object
      description: Validate an add-row body - the act slotted in on the day.
      properties:
        submissionId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        award:
          oneOf:
          - $ref: '#/components/schemas/AwardKindEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - submissionId
    AddTeacherRequest:
      type: object
      description: |-
        Validate an add-teacher request body.

        The consent is required here and nowhere else: a teacher is an adult whose details
        somebody else is entering, so the basis for holding them is that adult's own consent
        (LEGAL-001 §5.4). Once it is on file, an edit to a phone number has no reason to ask
        for it again.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type:
          - string
          - 'null'
        role:
          type: string
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        consentId:
          type: string
          format: uuid
        consentVersion:
          type: string
          maxLength: 40
      required:
      - consentId
      - consentVersion
      - firstName
      - lastName
      - role
    AllowedProvidersEnum:
      enum:
      - YOUTUBE
      - VK_VIDEO
      - RUTUBE
      - VIMEO
      type: string
      description: |-
        * `YOUTUBE` - YOUTUBE
        * `VK_VIDEO` - VK_VIDEO
        * `RUTUBE` - RUTUBE
        * `VIMEO` - VIMEO
    ApplicationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummaryResource'
        meta:
          $ref: '#/components/schemas/ApplicationMeta'
      required:
      - data
      - meta
    ApplicationMeta:
      type: object
      description: The ``meta`` envelope block, named to avoid a component clash.
      properties:
        requestId:
          type: string
      required:
      - requestId
    ApplicationResource:
      type: object
      description: An application (order) resource.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          default: application
        competitionId:
          type: string
          format: uuid
        applicantId:
          type: string
          format: uuid
        status:
          type: string
        hasCorrections:
          type: boolean
        correctionComment:
          type:
          - string
          - 'null'
        educationalOrganizationId:
          type:
          - string
          - 'null'
          format: uuid
        organizationName:
          type:
          - string
          - 'null'
        payer:
          oneOf:
          - $ref: '#/components/schemas/_Payer'
          - type: 'null'
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/_SubmissionRef'
        services:
          type: array
          items:
            $ref: '#/components/schemas/_ServiceLine'
        consents:
          type: array
          items:
            $ref: '#/components/schemas/_ConsentView'
        totalPrice:
          oneOf:
          - $ref: '#/components/schemas/_TotalPrice'
          - type: 'null'
        paymentReceipts:
          type: array
          items:
            $ref: '#/components/schemas/_PaymentReceipt'
        paidAt:
          type:
