          description: Not a platform administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown target kind, or no such object.
    delete:
      operationId: platform_purge_execute
      description: 'Hard delete, not the soft delete the rest of the platform uses:
        the rows are removed from the database and the files they reference are removed
        from storage. There is no undo. `confirm` must repeat the object''s own name
        exactly as the plan reports it.'
