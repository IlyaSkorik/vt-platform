  /api/v1/public/festivals:
    get:
      operationId: listPublicFestivals
      description: List every publicly-visible competition for the participant catalog.
      tags:
      - Public Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFestivalListEnvelope'
          description: ''
  /api/v1/public/festivals/{festival_id}:
    get:
      operationId: getPublicFestival
      description: |-
        The public landing view of a single competition.

        Powers the participant-facing Competition Landing Page: the hero facts, the
        organizer's Landing Builder blocks (enabled, in order) and the reused
        Competition Contacts. Unpublished, draft or archived competitions are
        indistinguishable from a missing id — both return a 404 problem, never
        leaking their existence.
      parameters:
      - in: path
        name: festival_id
        schema:
          type: string
        required: true
      tags:
      - Public Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFestivalDetailEnvelope'
          description: ''
  /api/v1/staff/invitations:
    post:
      operationId: createStaffInvitation
      description: Create an invitation for a person to join the organization as staff.
      summary: Invite a person to become staff
      tags:
      - Organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteStaffRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteStaffRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteStaffRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Forbidden.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation conflict.
  /api/v1/staff/invitations/{token}:
    get:
      operationId: getStaffInvitation
      description: Look up an invitation using the token from the email link.
      summary: Look up a staff invitation
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Organization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInvitationDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation already accepted.
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation expired.
  /api/v1/staff/invitations/accept:
    post:
      operationId: acceptStaffInvitation
      description: Accept an invitation using the token from the email link.
      summary: Accept a staff invitation
      tags:
      - Organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Forbidden or wrong invitee.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found.
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      description: Return the authenticated account (Identity) composed with its staff
        membership (Organization). `staffMembership` is null for non-staff users.
      summary: Get the current user composed with staff membership
      tags:
      - Identity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
          description: ''
        '401':
          description: No valid session.
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      description: Validate an invitation-acceptance request.
      properties:
        token:
          type: string
      required:
      - token
    AddAdditionalService:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          default: BYN
          maxLength: 3
        description:
          type:
          - string
          - 'null'
        billingModel:
          allOf:
          - $ref: '#/components/schemas/BillingModelEnum'
          default: PER_PARTICIPANT
        participationFormatIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        required:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
        sortOrder:
          type: integer
          minimum: 0
          default: 0
      required:
      - amount
      - name
      - participationFormatIds
    AddAdmissionRule:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        disciplineId:
          type: string
          format: uuid
        ageCategoryId:
          type: string
          format: uuid
        participantGroupId:
          type: string
          format: uuid
        participationFormatId:
          type: string
          format: uuid
      required:
      - ageCategoryId
      - categoryId
      - disciplineId
      - participantGroupId
      - participationFormatId
    AddAgeCategory:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        minAge:
          type: integer
          minimum: 0
        maxAge:
          type: integer
          minimum: 0
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
        type:
          allOf:
          - $ref: '#/components/schemas/TypeFd5Enum'
          default: STANDARD
        mixedCalculationMethod:
          oneOf:
          - $ref: '#/components/schemas/MixedCalculationMethodEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - categoryId
      - maxAge
      - minAge
      - name
    AddCategory:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        sortOrder:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - name
    AddContact:
      type: object
      properties:
        contactType:
          type: string
          maxLength: 32
        value:
          type: string
          maxLength: 500
