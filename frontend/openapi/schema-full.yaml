      type: object
      description: |-
        Validate a create-protocol body.

        ``name`` is optional: a protocol with no name given takes its nomination's, which is
        what an organizer would have typed anyway. ``seed`` defaults on - the point of opening
        a protocol is to get the day's running order in it.
      properties:
        competitionId:
          type: string
          format: uuid
        nominationId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnsEnum'
        seed:
          type: boolean
          default: true
      required:
      - competitionId
      - nominationId
    CreateShareRequest:
      type: object
      description: |-
        Validate a create-public-program body.

        ``columns`` is the selection that defines the edition - which columns of the table
        its reader sees. Omitting it publishes the default columns.

        Omitting ``itemIds`` (or sending an empty list) publishes every row and keeps
        following the programme - what a screen by the stage wants.
      properties:
        name:
          type: string
          maxLength: 200
        columns:
          type: array
          items:
            type: string
        itemIds:
          type: array
          items:
            type: string
            format: uuid
        controlsRunningOrder:
          type: boolean
          default: false
      required:
      - name
