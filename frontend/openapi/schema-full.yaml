        count, how many stored files would go with it, and the consequences worth
        reading twice.
      summary: What erasing this object would delete
      parameters:
      - in: path
        name: object_id
        schema:
          type: string
        required: true
      - in: path
        name: target
        schema:
          type: string
        required: true
