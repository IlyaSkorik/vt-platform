openapi: 3.1.0
info:
  title: VT Platform — Identity API
  version: "1.0"
  description: >-
    Authentication subset of the Identity bounded context (API-001), governed by
    API-000. This contract is the source of truth for the generated frontend SDK
    (Orval → TanStack Query). It intentionally covers only the endpoints the
    Authentication UI consumes; the full Identity contract lives server-side.
servers:
  - url: /api/v1
    description: Versioned API base (API-000 §2).
tags:
  - name: Identity
    description: Authentication, verification, and current-user resources.
paths:
  /auth/registration:
    post:
      operationId: registerAccount
      tags: [Identity]
      summary: Register a new adult account and trigger email verification.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/email-verification/requests:
    post:
      operationId: requestEmailVerification
      tags: [Identity]
      summary: (Re)send an email-verification challenge to the given address.
      description: >
        Public and anti-enumeration: names the address to send a fresh link to.
        An unknown, deleted, or already-verified address is a silent no-op, so the
        response is a uniform 202 that never reveals whether the address exists.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202": { description: "Request accepted (email dispatched if applicable)." }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/email-verification/confirmations:
    post:
      operationId: confirmEmailVerification
      tags: [Identity]
      summary: Confirm email ownership using the emailed token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/sessions:
    post:
      operationId: createSession
      tags: [Identity]
      summary: Authenticate credentials and establish a session (login).
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Session established; access token in body, refresh cookie set (web).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [Identity]
      summary: Revoke the current session and its refresh-token family (logout).
      responses:
        "204": { description: "Session revoked; refresh cookie cleared." }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/token/refresh:
    post:
      operationId: refreshAccessToken
      tags: [Identity]
      summary: Exchange a rotating refresh token for a new access token.
      security: []
      responses:
        "200":
          description: New access token issued; rotated refresh cookie set (web).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/password-reset/requests:
    post:
      operationId: requestPasswordReset
      tags: [Identity]
      summary: Begin password recovery; emails a reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202": { description: "Accepted (always, whether or not the email exists)." }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/password-reset/confirmations:
    post:
      operationId: confirmPasswordReset
      tags: [Identity]
      summary: Set a new password using the reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmation"
      responses:
        "204": { description: "Password reset; all sessions revoked." }
        "400": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      summary: Return the authenticated account composed with its staff membership.
      description: >-
        Composition endpoint (owned by no single bounded context): the Identity
        account plus the account's Organization staff membership. `staffMembership`
        is null for the vast majority of users, who are not staff.
      responses:
        "200":
          description: The current user, composed with staff membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401": { $ref: "#/components/responses/Problem" }
  /users/me/consents:
    get:
      operationId: listOwnConsents
      tags: [Identity]
      summary: List the consents currently in force for the signed-in account.
      description: >-
        Pass `history=true` for the whole journal, including superseded and withdrawn
        entries — a subject is entitled to know not only what they agreed to but when
        it changed.
      parameters:
        - name: history
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The account's consents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentsResponse"
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: recordOwnConsent
      tags: [Identity]
      summary: Record one accepted consent at the version displayed.
      description: >-
        Accepting a consent already held supersedes the earlier entry rather than
        replacing it, so the history of what was agreed to stays readable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: The recorded entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentsResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /users/me/consents/{consentType}:
    delete:
      operationId: withdrawOwnConsent
      tags: [Identity]
      summary: Withdraw a consent.
      description: >-
        Stamps the active entry withdrawn; the entry itself stays, because it is the
        evidence that the processing done while the consent was in force was lawful.
        Withdrawal is unconditional (art. 5 of Law No. 99-З), so withdrawing a consent
        that was never given also answers 204.
      parameters:
        - name: consentType
          in: path
          required: true
          schema:
            type: string
        - name: subjectParticipantId
          in: query
          required: false
          description: Set when withdrawing a consent given about one child.
          schema:
            type: string
            format: uuid
      responses:
        "204": { description: "The consent is no longer in force." }
        "401": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID for safe retries (API-000 §19).
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 Problem Details (API-000 §8).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    RegistrationRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        phone:
          type: string
        locale:
          type: string
          default: ru-RU
        timezone:
          type: string
        consents:
          type: array
          description: >-
            Consents accepted on the registration form, each with the version of the
            text that was displayed. Recorded in the same request as the account, so
            no account exists without the record of its lawful basis (LEGAL-001 §13.3).
          items:
            $ref: "#/components/schemas/ConsentAcceptance"
    ConsentAcceptance:
      type: object
      required: [consentType, version]
      properties:
        consentType:
          type: string
          maxLength: 32
        version:
          type: string
          maxLength: 64
    ConsentRecord:
      type: object
      required: [id, consentType, version, status]
      properties:
        id:
          type: string
        consentType:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [requested, granted, active, withdrawn, expired, superseded]
        purpose:
          type: string
          nullable: true
        subjectParticipantId:
          type: string
          nullable: true
        grantedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
    ConsentRequest:
      type: object
      required: [consentType, version]
      properties:
        consentType:
          type: string
          maxLength: 32
        version:
          type: string
          maxLength: 64
        purpose:
          type: string
          nullable: true
        subjectParticipantId:
          type: string
          format: uuid
          nullable: true
    ConsentsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsentRecord"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    EmailVerificationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmation:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 12
    # NOTE: Identity no longer exposes roles. Staff authorization lives entirely
    # in the Organization context and is surfaced only via
    # CurrentUserResponse.staffMembership. Do not reintroduce a roles concept on
    # User or a Role schema here.
    User:
      type: object
      required: [id, type, email, displayName, status, emailVerified]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [user] }
        email: { type: string, format: email }
        displayName: { type: string }
        status:
          type: string
          enum: [registered, active, suspended]
        emailVerified: { type: boolean }
        # The number itself, not only whether it is confirmed: this resource is
        # always the caller's own account, and the settings screen cannot offer
        # to change a value it is unable to show.
        phone: { type: string, nullable: true }
        phoneVerified: { type: boolean }
        mfaEnabled: { type: boolean }
        locale: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffMembership:
      type: object
      required: [role, status]
      description: >-
        The authenticated account's staff role over the organization (Organization
        context). Present only for staff; null otherwise.
      properties:
        role:
          type: string
          enum:
            - OWNER
            - DIRECTOR
            - FINANCE
            - COMPETITION_MANAGER
            - CONTENT_MANAGER
            - MODERATOR
            - SUPPORT
        status:
          type: string
          enum: [PENDING, ACTIVE, REVOKED]
        organizationId:
          type: string
          format: uuid
          description: >-
            Which organization the membership is in. The platform hosts several,
            so staff status is a fact about a person and an organization both.
    CurrentUser:
      type: object
      required: [user, staffMembership, platformAdmin]
      properties:
        user:
          $ref: "#/components/schemas/User"
        staffMembership:
          oneOf:
            - $ref: "#/components/schemas/StaffMembership"
            - type: "null"
        platformAdmin:
          type: boolean
          description: >-
            Whether the account operates the platform itself — connecting
            organizations and reading across all of them. Granted only by a
            management command, and never by anything inside an organization.
    Session:
      type: object
      required: [type, accessToken, tokenType, expiresIn]
      properties:
        type: { type: string, enum: [session] }
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer }
        user:
          $ref: "#/components/schemas/User"
    Token:
      type: object
      required: [type, accessToken, tokenType, expiresIn]
      properties:
        type: { type: string, enum: [session] }
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer }
    ResponseMeta:
      type: object
      properties:
        requestId: { type: string }
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Session"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    TokenResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Token"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ProblemFieldError:
      type: object
      properties:
        pointer: { type: string }
        code: { type: string }
        detail: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
security:
  - bearerAuth: []
