<!doctype html>
<html lang="ru" class="h-full" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Взлёт талантов — цифровая экосистема для организации детских творческих конкурсов."
    />
    <title>Взлёт талантов</title>
    <script>
      // Apply the persisted colour theme before first paint to avoid a
      // flash of the wrong theme (FOUC). Kept in sync with ThemeProvider.
      (() => {
        try {
          const stored = localStorage.getItem("vt-theme");
          const system = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          const theme = stored === "light" || stored === "dark" ? stored : system;
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch {
          /* localStorage unavailable — fall back to CSS media defaults */
        }
      })();
    </script>
  </head>
  <body class="h-full bg-background text-foreground antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
