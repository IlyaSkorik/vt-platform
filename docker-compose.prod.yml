# Production stack for the single-server deployment (OPS-008, ARCH-001 §16–§17).
#
# Differs from `backend/docker-compose.yml` in kind, not degree: that one is the development
# stack (runserver, bind-mounted source, mailhog, minio). Here nothing is bind-mounted, the
# images are immutable, and the only published port is nginx's.
#
#   docker compose -f docker-compose.prod.yml --env-file backend/.env up -d --build
#
# **TLS terminates in front of this stack** — the provider's load balancer, or nginx/Caddy on
# the host. Certificates are deliberately not managed here: renewal is a host concern with its
# own schedule, and baking certbot into an image that also serves assets couples two things
# that fail for unrelated reasons. To terminate TLS in *this* nginx instead (the shape OPS-008
# §7 describes), drop a server block into the `nginx_tls` mount and publish 443; the container
# includes `/etc/nginx/tls/*.conf` and ignores the directory when it is empty.
name: vt-platform-prod

# Every Django-side service runs the same image with a different command (ARCH-001 §17.2), and
# needs the same environment. Defined once here rather than copied four times, because the
# copies in the dev compose are exactly how `EMAIL_*` drifted between them.
x-django: &django
  image: ${BACKEND_IMAGE:-vt-backend:local}
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-./backend/.env}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    # Django needs the built index.html on disk to inject the `<head>` into; nginx publishes
    # it into this volume on start. Empty would silently unmount the SPA catch-all and every
    # browser route would 404.
    SPA_INDEX_PATH: /srv/spa/index.html
  volumes:
    # Only reached while S3_BUCKET is unset. Shared with the workers on purpose: a diploma is
    # rendered by a worker and downloaded through nginx, so they must see one filesystem.
    - media:/app/media
    - spa:/srv/spa:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  # --- Pre-deploy migration job (ARCH-001 §18.4) ----------------------------
  #
  # A one-shot service rather than a step in the API's command: with several containers off one
  # image, putting `migrate` in each start-up races them against each other on every deploy.
  # Everything else waits for this to exit 0, so a failed migration stops the deploy instead of
  # producing a half-migrated database serving traffic.
  migrate:
    image: ${BACKEND_IMAGE:-vt-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py migrate --noinput
    restart: "no"
    env_file:
      - ${ENV_FILE:-./backend/.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # --- API ------------------------------------------------------------------
  backend:
    <<: *django
    # Sizing lives in gunicorn.conf.py (OPS-008 §4); the image's CMD points at it.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SPA_INDEX_PATH: /srv/spa/index.html
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # nginx is a separate container, so the trusted proxy is not 127.0.0.1. Without this
      # gunicorn drops X-Forwarded-Proto, Django reads every request as plain HTTP and
      # SECURE_SSL_REDIRECT sends it into a redirect loop. Safe because the port below is
      # never published — nginx is the only thing that can reach it.
      GUNICORN_FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    # Long enough for gunicorn to finish what it is holding. Docker's default is 10 s, which is
    # *shorter than the application's own drain*: `gunicorn.conf.py` sets graceful_timeout 30, so
    # the default SIGKILLs the container while gunicorn is still politely finishing requests, and
    # whoever was mid-upload or mid-export loses it. 45 gives the drain its 30 plus margin.
    #
    # Not 120 (the request timeout): anything still running after 30 s has already been abandoned
    # by gunicorn itself, so waiting longer only makes deploys slower without saving work.
    stop_grace_period: 45s
    healthcheck:
      # The probe announces a host this deployment already allows, rather than ALLOWED_HOSTS
      # being widened to admit the loopback.
      #
      # It connects to 127.0.0.1 inside the container, so by default it announces
      # `Host: 127.0.0.1:8000` — which is in nobody's `DJANGO_ALLOWED_HOSTS`, because OPS-001
      # §3 sets that to the deployment's domain. Django answers 400, the container is unhealthy
      # forever while the application is perfectly fine, and `up --wait` fails with "dependency
      # failed to start" naming *nginx* — three steps from the cause.
      #
      # CI hides this: its throwaway environment sets `localhost,127.0.0.1`, so the probe passes
      # there and fails on every real host. `DJANGO_ALLOWED_HOSTS` is already in this container's
      # environment, and its first entry is by definition a host this deployment accepts.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ.get("DJANGO_ALLOWED_HOSTS", "localhost").split(",")[0].strip()
          probe = urllib.request.Request("http://127.0.0.1:8000/healthz", headers={"Host": host})
          urllib.request.urlopen(probe).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # --- Background work (OPS-008 §5) -----------------------------------------
  #
  # Two workers because the work is nothing alike. This one is CPU-bound, long and
  # memory-hungry: print runs and sweeps. The child limit matters more than usual — a run holds
  # a template PDF and every rendered page, and uploads each to the bucket.
  worker:
    <<: *django
    command: >
      celery -A config worker -l info
      --concurrency ${CELERY_CONCURRENCY:-2}
      --max-tasks-per-child 50
      --time-limit 3600 --soft-time-limit 3300
    # Three minutes to finish the task in hand on shutdown. A print run can take far longer than
    # that (`--time-limit` is an hour), so this is a deliberate bound rather than a promise: with
    # `CELERY_TASK_ACKS_LATE` the interrupted task is redelivered instead of lost, and generation
    # skips diplomas that already carry a rendered PDF — so a re-run resumes rather than restarts.
    # Waiting an hour on every deploy to avoid repeating a few pages would be the wrong trade.
    stop_grace_period: 180s
    # CMD-SHELL, not CMD: the node name contains the container hostname, and the exec form does
    # not expand variables. `$$` is compose's escape for a literal `$` handed to the container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 15s
      start_period: 45s
      retries: 3

  # Mail is not CPU work at all: each message spends ~2.8 s waiting on an SSL handshake, so one
  # slot could never reach the provider's 30-a-minute allowance (OPS-009). Four slots clear it
  # and still leave a password reset from waiting behind a diploma print run.
  mail-worker:
    <<: *django
    command: celery -A config worker -l info -Q mail --concurrency ${MAIL_CONCURRENCY:-4}
    # A message costs ~2.8 s, almost all of it the SSL handshake (OPS-009), so 30 s is several
    # times what four in-flight messages need.
    stop_grace_period: 30s

  beat:
    <<: *django
    # --schedule on a writable path; the unpaid-order sweep recomputes from the database each
    # run, so it survives restarts without a persisted schedule.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    # Beat holds no work of its own — it only enqueues.
    stop_grace_period: 15s

  # --- Edge: publish the SPA, then serve it ---------------------------------
  #
  # A one-shot job, not a server. It copies the built bundle and the nginx configuration out of the
  # frontend image into the volumes below and exits. That is what keeps nginx's own service
  # definition identical between deploys — and therefore keeps compose from recreating the one
  # container that owns the published port.
  #
  # Measured: recreating nginx costs ~14 s of *refused connections*, because nothing is listening.
  # Leaving it alone and restarting only the API costs ~1.4 s of 502, which nginx itself retries.
  spa:
    image: ${FRONTEND_IMAGE:-vt-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty: the client calls the same origin it was served from, and nginx fronts both.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        # The counters are compiled in, so they are set for the build, not for the run.
        # Unset here means an image with no analytics — see frontend/Dockerfile.
        VITE_YANDEX_METRICA_ID: ${VITE_YANDEX_METRICA_ID:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    restart: "no"
    volumes:
      - spa:/srv/spa
      - nginx_conf:/srv/nginx-conf

  nginx:
    # The stock upstream image, pinned. Nothing project-specific is baked in, so this reference
    # does not change when the frontend does — which is the entire point.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      # Loopback only: TLS terminates in front of this stack (see the header), and the host's
      # terminator is what publishes it. `HTTP_PORT` exists because CI already passes it and
      # because a second stack on one machine would otherwise collide here; the container always
      # listens on 8080 regardless.
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      # Both written by `spa` above. The bundle volume is also mounted by the Django services,
      # which read index.html out of it to inject the <head>.
      - nginx_conf:/etc/nginx/conf.d:ro
      - spa:/srv/spa:ro
      - media:/srv/media:ro
      # Drop a TLS server block in here to terminate TLS in nginx; empty by default. A path on the
      # host, not in the repository checkout: the deploy replaces that checkout, and a bind mount
      # whose source disappears breaks the container on its next restart.
      - ${NGINX_TLS_DIR:-/srv/vt-platform/nginx/tls}:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s
    depends_on:
      spa:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  # --- Data -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # `config_file` replaces the image's own; the mounted file therefore has to set
    # listen_addresses itself, since the built-in default (localhost) would refuse every
    # connection from another container. Tuning per OPS-008 §3.
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vt_platform}
      POSTGRES_USER: ${POSTGRES_USER:-vt_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Which tuning profile, not whether to tune: `vt-platform.conf` assumes the box is ours
      # alone (OPS-008 §3), and on a host shared with other applications its `shared_buffers` and
      # `effective_cache_size` are both a claim on memory and a lie to the planner. Point
      # `POSTGRES_CONF` at `vt-platform-small.conf` there. A path inside the checkout, so the
      # profile in use is versioned rather than edited on the machine.
      - ${POSTGRES_CONF:-./deploy/postgres/vt-platform.conf}:/etc/postgresql/postgresql.conf:ro
    # A shutdown checkpoint can take longer than Docker's 10 s default, and a SIGKILL mid-write
    # means recovery on the next start. Cheap insurance on the one service that holds the data.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vt_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # appendonly is on (OPS-008 §6): a restart must not lose queued tasks.
      - redis_data:/data
    # Time to flush the append-only file. The queue it protects is the reason appendonly is on
    # at all, so it should not be cut off while writing it.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  # Uploads and generated documents while S3_BUCKET is unset. With a bucket configured this
  # stays empty — and the deployment stops having local state worth backing up (OPS-007).
  media:
  # The built SPA, published by the `spa` job so nginx and Django agree on which bundle is live.
  spa:
  # nginx's configuration, published the same way — which is what lets nginx run from a stock
  # image whose reference never changes between deploys.
  nginx_conf:
