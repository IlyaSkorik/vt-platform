# Redis for the single-server deployment (OPS-008 §6).
#
# One instance carries three databases: 0 the cache, 1 the Celery broker, 2 results.

maxmemory 512mb

# **volatile-lru is load-bearing — do not "simplify" this to allkeys-lru.**
#
# Under allkeys-lru Redis would happily evict *queued task messages* from database 1 to make
# room for cache entries, and a lost message is a diploma run that silently never happens.
# volatile-lru evicts only keys carrying a TTL, which is exactly the cache (public programmes
# expire in 60 s) and never a queue entry.
maxmemory-policy volatile-lru

# A restart otherwise loses whatever was queued. For this workload the queue is small and the
# fsync cost is irrelevant.
appendonly yes
appendfsync everysec
