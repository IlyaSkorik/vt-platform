# PostgreSQL tuning for a host this application does not have to itself.
#
# `vt-platform.conf` is the profile OPS-008 §3 derives, and it assumes the box runs the stack and
# nothing else: 2 GB of `shared_buffers` and an `effective_cache_size` of 5 GB. Both are wrong on
# a shared machine — the first takes memory a co-tenant needs, and the second tells the planner
# about page cache that other applications are actually holding, which makes it prefer index scans
# that then read from disk.
#
# Sized for ~1 GB of PostgreSQL on a 4 GB box: the staging stand (OPS-001 §10), or any deployment
# sitting behind a proxy that serves other sites. The staging database is a few hundred MB of test
# data, so it still fits in cache entirely and query plans stay representative of production —
# which is what makes testing on it mean anything.
#
# Selected with POSTGRES_CONF in that host's .env:
#
#   POSTGRES_CONF=./deploy/postgres/vt-platform-small.conf

# The image's own config is replaced wholesale, so this file has to set this itself: the built-in
# default (localhost) would refuse every connection from another container.
listen_addresses = '*'
port = 5432

shared_buffers = 512MB                # ~12% of a 4 GB box, leaving room for the co-tenants
effective_cache_size = 1GB            # what the planner may assume the OS caches *for us*
work_mem = 8MB                        # per sort/hash node - not per query
maintenance_work_mem = 128MB
max_connections = 50                  # gunicorn and celery are turned down here too — OPS-001 §10

wal_compression = on
min_wal_size = 256MB
max_wal_size = 1GB                    # the disk is shared; WAL must not be able to fill it
checkpoint_completion_target = 0.9

random_page_cost = 1.1                # SSD, not a spinning disk
effective_io_concurrency = 200

autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
