# PostgreSQL tuning for the single-server deployment (OPS-008 §3).
#
# Values are for 4 vCPU / 8 GB. On the 2 vCPU / 6 GB box use the smaller figures OPS-008 §2
# gives: shared_buffers 1500MB, effective_cache_size 3500MB, work_mem 16MB, max_connections 50.
#
# Passed as `-c config_file=` in docker-compose.prod.yml, which *replaces* the image's own
# postgresql.conf rather than layering on it. Everything unset here therefore falls back to
# PostgreSQL's compiled-in defaults — which is why the two settings below are not tuning but
# requirements: `listen_addresses` defaults to `localhost`, and a database that only listens on
# loopback refuses every connection from another container.

# --- Connectivity (required, not tuning) ------------------------------------
listen_addresses = '*'
port = 5432

# --- Memory -----------------------------------------------------------------
shared_buffers = 2GB                  # ~25% of RAM
effective_cache_size = 5GB            # what the planner may assume the OS caches
work_mem = 24MB                       # per sort/hash node - not per query
maintenance_work_mem = 512MB

# CONN_MAX_AGE is 60s in config/settings/base.py, so connections are reused rather than
# reopened per request. 3 web workers plus 2 Celery slots cannot approach this, which is why
# OPS-008 §3 calls pgbouncer unnecessary at this size.
max_connections = 100

# --- Write-ahead log --------------------------------------------------------
wal_compression = on
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# --- Planner ----------------------------------------------------------------
random_page_cost = 1.1                # NVMe, not a spinning disk
effective_io_concurrency = 200

# --- Autovacuum -------------------------------------------------------------
# Applications and programme items churn, so vacuum earlier than the defaults would.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Observability ----------------------------------------------------------
log_min_duration_statement = 500ms    # the only slow-query signal you get on one box
log_checkpoints = on
log_lock_waits = on
