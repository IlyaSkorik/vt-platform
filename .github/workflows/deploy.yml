# Deploy (ARCH-001 §18.4) — via a self-hosted runner on the deployment host.
#
# Images are built on GitHub's runners and pushed to GHCR tagged with the commit SHA; the rollout
# then happens on the machine itself, through a self-hosted runner. No SSH keys, no `known_hosts`,
# no shell quoting across a remote heredoc — the deploy steps are ordinary local commands.
#
# It also removes a whole failure mode: the runner's workspace is a checkout of the very commit
# whose images are being deployed, so `docker-compose.prod.yml` and the postgres/redis/nginx
# configuration it mounts can never be a different version from the code that is running.
#
# **Security note, because self-hosted runners have one sharp edge.** A self-hosted runner must
# never execute code from a fork. This workflow is triggered only by pushes to `main` and by
# manual dispatch, so a pull request cannot reach it. Keep it that way: adding `pull_request`
# here would let anyone who opens a PR run arbitrary commands on the production host.
#
# **What has to exist before the first run:**
#
#   1. A self-hosted runner registered on the host, labelled `production`
#      (Settings → Actions → Runners → New self-hosted runner), running as a user in the
#      `docker` group.
#   2. Environment `production` (Settings → Environments) with **required reviewers** — that
#      approval is what makes this gated — and:
#        Variables  ENV_FILE_PATH  absolute path to the host's real .env
#                                  (default /srv/vt-platform/backend/.env)
#                   PUBLIC_URL     https://… — the post-deploy check calls /healthz on it
#
# The real secrets live only in that .env file on the host. They are never in the repository and
# never pass through Actions: this workflow only decides which image tags to run.
name: Deploy

on:
  push:
    branches: [main]
  # Re-deploying an older, known-good SHA is the fastest rollback there is, so it is a first-class
  # entry point rather than something to reconstruct under pressure.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the current ref)"
        required: false

# One deploy at a time, and never cancel one midway: a cancelled deploy can leave migrations
# applied and the old image still serving.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish images
    # GitHub-hosted on purpose: building is CPU- and disk-hungry, and doing it on the production
    # box would compete with the application it is about to replace.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      backend_image: ${{ steps.resolve.outputs.backend_image }}
      frontend_image: ${{ steps.resolve.outputs.frontend_image }}
    steps:
      - id: resolve
        run: |
          SHA="${{ inputs.sha || github.sha }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Tagged by SHA, not `latest`: what is running must be identifiable, and a rollback must
          # be able to name the thing it is rolling back to.
          echo "backend_image=$REGISTRY/$OWNER/$REPO-backend:$SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$REGISTRY/$OWNER/$REPO-frontend:$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.resolve.outputs.backend_image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.resolve.outputs.frontend_image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to production
    # The label the runner on the deployment host is registered with.
    runs-on: [self-hosted, production]
    needs: [publish]
    permissions:
      contents: read
      packages: read
    # The gate: approval lives on this environment, so a rollout cannot happen unattended.
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      # The compose project name is fixed inside the compose file, so containers and named volumes
      # are found no matter which directory this runs from — which is what lets the deploy work out
      # of the runner's own workspace instead of a separately maintained checkout.
      ENV_FILE: ${{ vars.ENV_FILE_PATH || '/srv/vt-platform/backend/.env' }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
      SHA: ${{ needs.publish.outputs.sha }}
    steps:
      # The workspace becomes the deployed commit, so the compose file and every mounted config
      # match the images below by construction.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}

      - name: Check the host is configured
        run: |
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found on this host. It holds the real secrets and is"
            echo "::error::deliberately outside the repository — see OPS-001 §3."
            exit 1
          fi
          # Compose reads POSTGRES_PASSWORD from its own environment for the `:?` guard, and the
          # backup step below needs the database name and user the host actually configured.
          set -a; . "$ENV_FILE"; set +a
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_USER=${POSTGRES_USER:-vt_platform}"
            echo "POSTGRES_DB=${POSTGRES_DB:-vt_platform}"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Back the database up
        run: |
          # OPS-008 §9 wants a dump before every deploy. It is cheap, and it is the only thing
          # that makes a failed migration recoverable rather than merely visible.
          mkdir -p /srv/vt-platform/backups
          out="/srv/vt-platform/backups/pre-deploy-$SHA.dump"
          if docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" \
               exec -T postgres pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB" > "$out" 2>/dev/null; then
            echo "dumped $(du -h "$out" | cut -f1) to $out"
          else
            rm -f "$out"
            echo "no running database to dump — first deploy, continuing"
          fi

          # Keep the five most recent and delete the rest.
          #
          # Without this the deploy is a slow disk-space leak: a dump is 1–3 GB per season
          # (OPS-008 §2) on a 50 GB disk, one per deploy, forever — and it would fill up months
          # later, during a deploy, which is the worst moment for the disk to be full.
          #
          # Five is enough to roll back through a bad week. These are a *safety net for this
          # rollout*, not the backup strategy: nightly dumps belong off the machine (OPS-008 §9).
          ls -1t /srv/vt-platform/backups/pre-deploy-*.dump 2>/dev/null | tail -n +6 | while read -r old; do
            echo "pruning $(basename "$old")"
            rm -f "$old"
          done

      - name: Pull the new images
        # `spa`, not `nginx`: nginx runs from a stock upstream image whose reference never changes,
        # which is what keeps it from being recreated. The frontend build arrives in the `spa`
        # publisher instead.
        run: docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" pull backend spa

      - name: Migrate (pre-deploy, expand phase)
        run: |
          # Explicit rather than left to the compose dependency, so the migration output lands in
          # the deploy log under its own heading and a failure names itself. The rollout below
          # starts the migrate service too — by then a no-op reporting "no migrations to apply".
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" run --rm migrate

      - name: Roll out
        run: |
          # `up` publishes the new bundle and config through the one-shot `spa` job, then recreates
          # only what actually changed. Measured on this stack: a frontend-only change costs zero
          # failed requests (nginx is never recreated), and an API change costs ~0.2 s of 502 that
          # nginx retries on the client's behalf.
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" \
            up -d --wait --wait-timeout 300

          # The config volume was just refreshed; a reload picks it up without dropping a
          # connection. A no-op when nothing changed, so it is unconditional.
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" \
            exec -T nginx nginx -s reload

      - name: Verify from outside
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "PUBLIC_URL is not set; skipping the external check"
            exit 0
          fi
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/healthz" || true)
            [ "$code" = "200" ] && { echo "healthz answered 200"; exit 0; }
            echo "attempt $attempt: $code"
            sleep 6
          done
          echo "::error::the deployment never answered 200 on /healthz"
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" ps
          docker compose -f docker-compose.prod.yml --env-file "$ENV_FILE" logs --tail 80

      - name: Reclaim disk
        if: always()
        run: |
          # Only what this host no longer references, and only past a week, so an older tag stays
          # pullable for a rollback while the disk does not grow forever.
          docker image prune -f --filter "until=168h" >/dev/null || true
