# Staging — where Настя tests, refreshed automatically from `main`.
#
# **The trigger is `workflow_run`, not `push`, on purpose.** The previous deploy workflow ran on
# `push: [main]`, which meant it started *in parallel with* CI rather than after it: a red test
# suite did not stop images from being published or a rollout from beginning. Hanging this on CI's
# completion, and checking the conclusion, is what makes "если CI не падает — тогда разворачиваем"
# actually true rather than merely intended.
#
# Nothing here is gated: staging is not a decision, it is a place to look. The decision — whether
# a tested set of tasks goes live — is `release.yml`, and it is manual.
#
# **Building images and occupying the stand are two different things, and this file keeps them
# apart.** `publish` runs for every green branch it is triggered on; `staging` rolls out only the
# branch that currently *owns* the stand. There is one stand and the redesign lives on it for
# weeks, so without that split a production fire would be unfixable: the hotfix's images would
# never be built, and `release.yml` refuses a SHA whose images are missing. With it, a push to
# `main` always produces a releasable artefact even while Настя is looking at the redesign.
#
# Ownership is the repository variable `STAGING_TRACK` (default `main` when unset), set under
# Settings → Secrets and variables → Actions → Variables, or:
#
#     gh variable set STAGING_TRACK -b redesign   # стенд отдан редизайну
#     gh variable set STAGING_TRACK -b main       # стенд вернулся на main
#
# It is a variable rather than a line in this file because the stand changes hands often and a
# commit to `main` is a poor way to say "подвинься на час". Either branch can also be put on the
# stand for one rollout by dispatching this workflow against it, which does not change ownership —
# the next green push to the owning branch takes the stand back.
#
# Images are built once, here, tagged with the commit SHA, and `release.yml` refuses to deploy a
# SHA whose images do not already exist. That is what makes the artefact promoted to production
# byte-for-byte the one that was tested, instead of a rebuild that merely came from the same
# source.
#
# **Security note.** The deploy job runs on a self-hosted runner, which must never execute code
# from a fork. `workflow_run` fires with the *base* repository's workflow definition and this one
# additionally requires the triggering run to be a `push` to `main`, so a pull request cannot
# reach the host.
#
# What has to exist before the first run — see OPS-001 §11 for the walkthrough:
#
#   1. A self-hosted runner on the staging host, labelled `staging`.
#   2. Environment `staging` (Settings → Environments), **without** required reviewers, with:
#        Variables  ENV_FILE_PATH  /srv/vt-platform/backend/.env
#                   PUBLIC_URL     https://test.… — the post-deploy check calls /healthz on it
#   3. Repository secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (optional; without them the
#      rollout is silent but still works).
name: Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, redesign]
  # Re-deploying the stand by hand — after rebuilding the host, or to put an older SHA back on it
  # while a regression is investigated.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the tip of main)"
        required: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish images
    # Deliberately *not* conditioned on which branch this is. Every green push to any branch in
    # the trigger above gets images, because that is what keeps a production hotfix possible while
    # the stand belongs to someone else. The branch check lives on the `staging` job below.
    #
    # Manual runs are trusted; automatic ones only follow a *green* CI on a push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # GitHub-hosted on purpose: building is CPU- and disk-hungry, and doing it on a deployment box
    # would compete with the application it is about to replace.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      backend_image: ${{ steps.resolve.outputs.backend_image }}
      frontend_image: ${{ steps.resolve.outputs.frontend_image }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - id: resolve
        run: |
          SHA="${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Tagged by SHA, not `latest`: what is running must be identifiable, a release must be
          # able to name the artefact it promotes, and a rollback must be able to name the thing
          # it is rolling back to.
          echo "backend_image=$REGISTRY/$OWNER/$REPO-backend:$SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$REGISTRY/$OWNER/$REPO-frontend:$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          # The whole history, because the note below is a range against the `staging` tag.
          fetch-depth: 0

      # What arrived on the stand, in the words the tracker uses. Настя tests per task in YouGile,
      # so a message listing SHAs would tell her nothing she can act on; a list of task references
      # tells her exactly which cards to move into her column.
      - id: notes
        name: Collect what is in this rollout
        run: |
          SHA="${{ steps.resolve.outputs.sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          # `actions/checkout` with fetch-depth: 0 already brings the tags; this only covers the
          # case where it did not, and must not fail the step when the tag does not exist yet.
          git fetch --force --tags origin >/dev/null 2>&1 || true
          # And main by name. `actions/checkout` was given a SHA, and what it fetches for a SHA
          # does not reliably include a remote-tracking ref for main — without this the branch
          # range below silently falls through to the tag case and reports main's commits as
          # though they were part of the redesign.
          git fetch --force origin main:refs/remotes/origin/main >/dev/null 2>&1 || true

          if [ "$BRANCH" != "main" ] && git rev-parse -q --verify origin/main >/dev/null; then
            # A side branch. The `staging` tag sits on main's line, so a range against it would
            # list main's commits mixed in with this branch's and read as though they had arrived
            # on the stand too. What is actually useful is how this branch differs from main —
            # that is exactly what is about to be shown on the stand and nowhere else.
            RANGE="origin/main..$SHA"
          elif git rev-parse -q --verify refs/tags/staging >/dev/null && \
             [ "$(git rev-parse refs/tags/staging)" != "$SHA" ]; then
            RANGE="refs/tags/staging..$SHA"
          else
            # First run, or the tag already points here (a re-deploy): a short window rather than
            # the entire history of the project.
            RANGE="$SHA~5..$SHA"
          fi

          # Every git call below is `|| true`: the step is `bash -e`, and a failed command
          # substitution inside an assignment aborts the script. A rollout must not be reported as
          # broken because its changelog could not be built.
          commits=$(git log --no-merges --pretty='• %s' "$RANGE" 2>/dev/null | head -20 || true)
          total=$(git log --no-merges --oneline "$RANGE" 2>/dev/null | wc -l || true)
          if [ "${total:-0}" -gt 20 ]; then
            commits="$commits
          … и ещё $((total - 20))"
          fi

          # The `Refs:` footer CONTRIBUTING §3 defines, deduplicated — the YouGile cards this
          # rollout touches.
          tasks=$(git log --no-merges --pretty='%(trailers:key=Refs,valueonly)' "$RANGE" 2>/dev/null \
                  | tr ',' '\n' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
                  | grep -v '^$' | sort -u | paste -sd' ' - || true)
          if [ -n "$tasks" ]; then
            commits="$commits

          задачи: $tasks"
          fi

          # With one stand serving two branches, "что приехало" is incomplete without "откуда".
          # A rollout note that lists only commit subjects looks identical whether the stand is
          # showing the redesign or a hotfix on main, which is precisely the confusion to avoid.
          if [ "$BRANCH" != "main" ]; then
            commits="ветка: $BRANCH

          $commits"
          fi

          {
            echo "notes<<GH_EOF"
            echo "$commits"
            echo "GH_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$commits" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.resolve.outputs.backend_image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.resolve.outputs.frontend_image }}
          # The analytics counters are compiled into the bundle, so they are set here rather than
          # on the running container. They are public identifiers — they appear in the page source
          # of every site that uses them — so they are not secrets, and keeping them in the
          # workflow is what makes a deploy carry them without anyone having to remember a
          # variable. A build without them (any local `docker build`) simply ships no counter.
          #
          # The same image serves staging and production, so the stand reports into the same
          # counters. That is the price of promoting an identical artefact; filter by host in the
          # analytics rather than rebuilding for production.
          build-args: |
            VITE_YANDEX_METRICA_ID=111697674
            VITE_GA_MEASUREMENT_ID=G-Y7PXD7CE9E
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  staging:
    name: Staging
    needs: [publish]
    # Who owns the stand. An automatic rollout happens only for the branch named by
    # `STAGING_TRACK` (default `main`); a push to the other branch stops after `publish`, having
    # produced images and disturbed nothing. A dispatch always deploys — asking for a rollout by
    # hand *is* the statement that this is what should be on the stand right now.
    #
    # `vars.STAGING_TRACK || 'main'` rather than a bare comparison: an unset or deleted variable
    # must mean "стенд за main", not "стенд ничей", or clearing it by accident would silently stop
    # every staging deploy and the first symptom would be a stale stand nobody can explain.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == (vars.STAGING_TRACK || 'main')
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      environment: staging
      runner_labels: '["self-hosted","staging"]'
      sha: ${{ needs.publish.outputs.sha }}
      backend_image: ${{ needs.publish.outputs.backend_image }}
      frontend_image: ${{ needs.publish.outputs.frontend_image }}
      notes: ${{ needs.publish.outputs.notes }}
    secrets: inherit

  parked:
    name: Report images built without a rollout
    needs: [publish, staging]
    # The branch that pushed does not own the stand. Images exist, nothing was deployed — and that
    # is the whole point of the split, but it is also invisible: the run goes green with a skipped
    # job and a fire on `main` would otherwise look like "деплой прошёл" to anyone glancing at it.
    # This is the one case where saying nothing is worse than a notification.
    if: always() && needs.publish.result == 'success' && needs.staging.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Tell Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRACK: ${{ vars.STAGING_TRACK || 'main' }}
          SHA: ${{ needs.publish.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Same contract as every other notifier here: unset token means silence, never a failed
          # step. A broken notifier must not redden a run whose actual work succeeded.
          [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || { echo "Telegram not configured; skipping"; exit 0; }
          text="📦 образы ${SHA:0:7} ($BRANCH) собраны
          стенд сейчас за веткой $TRACK, поэтому на него ничего не поехало

          выкатить в прод: Actions → Release → sha=${SHA:0:7}
          показать на стенде: Actions → Staging → ветка $BRANCH
          лог: $RUN_URL"
          curl -fsS --max-time 15 \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" >/dev/null 2>&1 || true

  mark:
    name: Move the staging tag
    needs: [publish, staging]
    # Only for main. The tag answers "что написано, но ещё не на стенде" (`git log staging..main`)
    # and feeds the next rollout's note; moved onto a redesign commit it would answer neither, and
    # `release.yml` — which diffs its own candidate against `production` — would start describing
    # releases in terms of a commit that was never on main.
    if: (github.event.workflow_run.head_branch || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `git log staging..main` then answers "what is on the stand but not released" for a human,
      # and it is what the next run diffs against to build its note.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git tag -f staging "${{ needs.publish.outputs.sha }}"
          git push -f origin refs/tags/staging
