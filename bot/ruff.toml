# Same standards as the backend (ARCH-001 §26.1), minus the Django-specific rules.
line-length = 150
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    # Every string a person reads is Russian; Cyrillic letters that resemble Latin ones are
    # the point, not a typo. Same reasoning as backend/ruff.toml.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.isort]
known-first-party = ["support_bot"]

[format]
quote-style = "double"
indent-style = "space"
