# Ruff configuration — linting & formatting (ARCH-001 §26.1).
line-length = 150
target-version = "py313"

extend-exclude = ["**/migrations/*"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "N999", # allow existing module naming
]

[lint.per-file-ignores]
# Split settings intentionally use star-imports to compose environments.
"config/settings/*.py" = ["F403", "F405"]
"__init__.py" = ["F401"]
# ORM persistence models: Django `Meta.indexes`/`constraints` are class-level
# lists by design (RUF012); optional domain fields (`X | None`) map faithfully
# to nullable columns, where NULL means "absent" — distinct from "" (DJ001).
"apps/*/infrastructure/models/*.py" = ["RUF012", "DJ001"]
# REST serializers: field names are the API's camelCase wire keys (API-000 §7),
# which the platform contract mandates over pep8 snake_case (N815). Matches any
# serializer module (e.g. `serializers.py`, `public_serializers.py`).
"apps/*/presentation/**/*serializers.py" = ["N815"]
# Localized transactional-email copy is Russian (the platform's primary language,
# ARCH-001): Cyrillic letters that resemble Latin ones are intentional, not typos.
"apps/*/infrastructure/messaging/email_gateway.py" = ["RUF001"]

[lint.isort]
known-first-party = ["apps", "config", "shared"]

[format]
quote-style = "double"
indent-style = "space"
