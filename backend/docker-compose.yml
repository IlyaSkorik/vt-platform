# Local development stack (ARCH-001 §17.3) — full dev/prod parity for the
# database, cache/broker, queue, object-store, and email subsystems.
name: vt-platform

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Match the host bind-mount owner so MEDIA_ROOT (`./media`) is writable.
    # The image defaults to system user `app` (uid 999), which cannot create
    # files under a host-owned 1000:1000 mount.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    # Inside the compose network, services reach each other by service name —
    # not `localhost` (that resolves to the container itself). These override
    # the host-oriented defaults in `.env` so the stack is self-contained.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # The whole transport, not just the host: with a real provider in .env the port
      # and SSL flags would come from there and nothing could reach Mailhog.
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_USE_SSL: "false"
      EMAIL_USE_TLS: "false"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # The whole transport, not just the host: with a real provider in .env the port
      # and SSL flags would come from there and nothing could reach Mailhog.
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_USE_SSL: "false"
      EMAIL_USE_TLS: "false"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mail has its own worker because a message costs ~2.8 s almost entirely in opening an
  # SSL connection, so one slot cannot reach the provider's 30-a-minute allowance. Four
  # slots clear it and still use only 4 of the 10 sessions the contract permits. It also
  # keeps a password reset from waiting behind a diploma print run.
  mail-worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: celery -A config worker -l info -Q mail --concurrency 4
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # The whole transport, not just the host: with a real provider in .env the port
      # and SSL flags would come from there and nothing could reach Mailhog.
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_USE_SSL: "false"
      EMAIL_USE_TLS: "false"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # `--schedule` writes to /tmp: avoid writing celerybeat-schedule into the
    # host-owned bind mount.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # The whole transport, not just the host: with a real provider in .env the port
      # and SSL flags would come from there and nothing could reach Mailhog.
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_USE_SSL: "false"
      EMAIL_USE_TLS: "false"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vt_platform}
      POSTGRES_USER: ${POSTGRES_USER:-vt_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vt_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vt_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:
