[project]
name = "vt-platform-backend"
version = "0.1.0"
description = "VT Platform («Взлёт талантов») — backend modular monolith (Django 6 + DRF, Clean Architecture)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "VT Platform Backend Team" }]

dependencies = [
    "django>=6.0,<7.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.28",
    "django-filter>=25.1",
    "django-cors-headers>=4.7",
    "whitenoise>=6.9",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.5",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "argon2-cffi>=23.1",
    "gunicorn>=23.0",
    "uvicorn>=0.34",
    "pypdf>=6.14.2",
    "reportlab>=5.0.0",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "pre-commit>=4.1",
]

[tool.uv]
package = false

[tool.coverage.report]
# Protocol method bodies and type-only imports are never executed at runtime.
exclude_also = [
    '^\s*\.\.\.\s*$',
    'if TYPE_CHECKING:',
]
